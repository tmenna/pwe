databases:
  - name: pwe-db
    plan: free
    databaseName: pwe
    user: pwe
    region: oregon

services:
  - type: web
    name: pwe-portal
    plan: free
    runtime: node
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npm run build && npm run db:push
    startCommand: npm start
    healthCheckPath: /api/config/recaptcha
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pwe-db
          property: connectionString
      - key: UPLOADS_DIR
        value: /tmp/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"

databases:
  - name: pwe-db
    plan: free
    databaseName: pwe
    user: pwe
    region: oregon

services:
  - type: web
    name: pwe-portal
    plan: free
    runtime: node
    region: oregon
    branch: main
    buildCommand: npm install --include=dev && npm run build && npm run db:push
    startCommand: npm start
    healthCheckPath: /api/stats
    envVars:
      - key: NODE_ENV
        value: production

      # Session
      - key: SESSION_SECRET
        generateValue: true

      # Database (auto-wired from the database above)
      - key: DATABASE_URL
        fromDatabase:
          name: pwe-db
          property: connectionString

      # Upload settings (local disk; replace with R2 vars for persistence)
      - key: UPLOADS_DIR
        value: /tmp/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"

      # ---- Cloudflare R2 (set manually in Render dashboard) ----
      # - key: R2_ENDPOINT
      #   value: https://<account-id>.r2.cloudflarestorage.com
      # - key: R2_ACCESS_KEY_ID
      #   value: <your-access-key-id>
      # - key: R2_SECRET_ACCESS_KEY
      #   value: <your-secret-access-key>
      # - key: R2_BUCKET
      #   value: pwe-uploads
      # - key: R2_PUBLIC_URL
      #   value: https://files.yourpwedomain.org   # optional CDN URL

      # ---- Resend Email (set manually in Render dashboard) ----
      # - key: RESEND_API_KEY
      #   value: re_xxxxxxxxxxxx
      # - key: FROM_EMAIL
      #   value: "PWE Portal <noreply@pwe.org>"
      # - key: APP_URL
      #   value: https://pwe-portal.onrender.com
